<!DOCTYPE html>
<html>
<head>
  <title>Nanobubble Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="style.css?v=3"> 
</head>
<body>
  <div class="card">
    <h1>Control Panel</h1>
    <button class="btn-start" onclick="startSystem()">START SYSTEM</button><br>
    <button class="btn-stop" onclick="stopSystem()">STOP SYSTEM</button>

    <div class="status-container">
      <h2>Live Relay Status</h2>
      <div class="grid">
        <div class="relay-box" id="r0">Relay 1: OFF</div>
        <div class="relay-box" id="r1">Relay 2: OFF</div>
        <div class="relay-box" id="r2">Relay 3: OFF</div>
        <div class="relay-box" id="r3">Relay 4: OFF</div>
        <div class="relay-box" id="r4">Relay 5: OFF</div>
        <div class="relay-box" id="r5">Relay 6: OFF</div>
        <div class="relay-box" id="r6">Relay 7: OFF</div>
        <div class="relay-box" id="r7">Relay 8: OFF</div>
      </div>
    </div>
  </div>
  <script src="app.js?v=3"></script>
</body>
</html>
